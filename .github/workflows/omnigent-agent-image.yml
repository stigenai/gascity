name: Omnigent agent images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: omnigent-agent-image-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build linux/${{ matrix.architecture }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image references
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          {
            echo "TARGET_ARCH=${TARGET_ARCH}"
            echo "BASE_ARCH_REF=ghcr.io/${{ github.repository_owner }}/gascity-agent-base:sha-${GITHUB_SHA}-${TARGET_ARCH}"
            echo "AGENT_ARCH_REF=ghcr.io/${{ github.repository_owner }}/gascity-agent:sha-${GITHUB_SHA}-${TARGET_ARCH}"
          } >> "$GITHUB_ENV"

      - name: Prepare architecture-specific binaries
        run: .github/scripts/prepare-agent-image-inputs.sh "${TARGET_ARCH}"

      - name: Build and publish base image
        run: |
          set -euo pipefail
          . ./deps.env
          docker buildx build \
            --platform "linux/${TARGET_ARCH}" \
            --build-arg DOLT_VERSION="$DOLT_VERSION" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            -f contrib/k8s/Dockerfile.base \
            -t "$BASE_ARCH_REF" \
            .

      - name: Build and publish agent image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "linux/${TARGET_ARCH}" \
            --build-arg BASE_IMAGE="$BASE_ARCH_REF" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            -f contrib/k8s/Dockerfile.agent \
            -t "$AGENT_ARCH_REF" \
            .

      - name: Verify published image provenance and startup
        run: .github/scripts/verify-omnigent-image.sh "${AGENT_ARCH_REF}"

  manifest:
    name: Publish multi-architecture manifests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable rollback references
        run: |
          set -euo pipefail
          agent_image="ghcr.io/${{ github.repository_owner }}/gascity-agent"
          base_image="ghcr.io/${{ github.repository_owner }}/gascity-agent-base"
          release_tag="sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME#v}"
          fi
          docker buildx imagetools create \
            -t "${agent_image}:${release_tag}" \
            "${agent_image}:sha-${GITHUB_SHA}-amd64" \
            "${agent_image}:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools create \
            -t "${base_image}:${release_tag}" \
            "${base_image}:sha-${GITHUB_SHA}-amd64" \
            "${base_image}:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${agent_image}:${release_tag}"
          docker buildx imagetools inspect "${base_image}:${release_tag}"
